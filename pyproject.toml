[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carmem"
version = "0.1.0"
description = "On-device, identity-scoped memory for in-car LLM assistants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8"]

[project.scripts]
carmem = "carmem.cli:main"

[tool.setuptools.packages.find]
include = ["carmem*", "bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
